name: Build pz3d Loader
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and check
        shell: bash
        run: ./gradlew --no-daemon build panelPreview
      - name: Build Windows bridge
        if: runner.os == 'Windows'
        shell: bash
        run: ./gradlew --no-daemon nativeBridge
      - uses: actions/upload-artifact@v4
        with:
          name: pz3dLoader-${{ matrix.os }}
          path: |
            build/pz3dLoader.jar
            build/pz3dLoader.dll
            build/PZ3D-bootstrap-template.jar
            build/pz3dLoader-ui-preview.png
            LICENSE.txt
